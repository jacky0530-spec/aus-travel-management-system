<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>澳洲旅遊調度與發票管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .card-shadow { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* 讓卡片在滑鼠移過去時才顯示編輯按鈕 */
        .order-card .action-btns { opacity: 0; transition: opacity 0.2s; }
        .order-card:hover .action-btns { opacity: 1; }
    </style>
</head>
<body class="p-6 max-w-7xl mx-auto relative">

    <header class="mb-8 flex justify-between items-end">
        <div>
            <h1 class="text-3xl font-bold text-slate-800">澳洲旅遊業務總覽</h1>
            <p class="text-slate-500 mt-2 font-bold" id="statusText">正在檢查系統狀態...</p>
        </div>
    </header>

    <!-- 0. 智慧解析區 -->
    <section class="mb-6 bg-blue-50 p-6 rounded-xl border border-blue-200 shadow-sm">
        <h2 class="text-lg font-bold text-blue-800 mb-2">⚡ 智慧文字解析 (貼上 LINE 訂單)</h2>
        <textarea id="rawOrderText" rows="4" class="w-full p-3 border border-blue-300 rounded-md focus:ring-blue-500" placeholder="在此貼上 LINE 群組的原始文字訂單..."></textarea>
        <div class="mt-3 flex justify-end">
            <button type="button" id="parseBtn" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-700 transition">
                自動解析欄位 ↓
            </button>
        </div>
    </section>

    <!-- 1. 表單區塊 -->
    <section class="mb-10 bg-white p-6 rounded-xl border border-slate-200 card-shadow transition-colors duration-300" id="formSection">
        <h2 id="formTitle" class="text-xl font-bold text-slate-800 mb-4 transition-colors">🆕 快速錄入新訂單</h2>
        <form id="orderForm" class="grid grid-cols-1 md:grid-cols-6 gap-4">
            <div class="md:col-span-1">
                <label class="block text-sm font-medium text-slate-700">經營模式</label>
                <select id="mode" class="mt-1 block w-full p-2 border border-slate-300 rounded-md bg-slate-50" required>
                    <option value="Mode_A">Mode A: 自營自出</option>
                    <option value="Mode_B">Mode B: 轉給同業</option>
                    <option value="Mode_C">Mode C: 同業轉入</option>
                </select>
            </div>
            <div class="md:col-span-1">
                <label class="block text-sm font-medium text-slate-700">旅客姓名 / 訂單號</label>
                <input type="text" id="customer" class="mt-1 block w-full p-2 border border-slate-300 rounded-md" required>
            </div>
            <div class="md:col-span-1">
                <label class="block text-sm font-medium text-slate-700">人數 (Pax)</label>
                <input type="number" id="pax" value="1" min="1" class="mt-1 block w-full p-2 border border-slate-300 rounded-md" required>
            </div>
            <div class="md:col-span-1">
                <label class="block text-sm font-medium text-slate-700">總額 (AUD)</label>
                <input type="number" step="0.01" id="aud" class="mt-1 block w-full p-2 border border-slate-300 rounded-md" required>
            </div>
            <div class="md:col-span-1">
                <label class="block text-sm font-medium text-slate-700">匯率</label>
                <input type="number" step="0.01" id="fxRate" value="23" class="mt-1 block w-full p-2 border border-slate-300 rounded-md" required>
            </div>
            <div class="md:col-span-1">
                <label class="block text-sm font-medium text-slate-700">出發時間</label>
                <input type="text" id="departureTime" placeholder="如 2026-05-04 09:30" class="mt-1 block w-full p-2 border border-slate-300 rounded-md bg-yellow-50 focus:bg-white transition">
            </div>
            <div class="md:col-span-4">
                <label class="block text-sm font-medium text-slate-700">行程詳情 / 備註</label>
                <textarea id="note" rows="2" class="mt-1 block w-full p-2 border border-slate-300 rounded-md"></textarea>
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-slate-700">特殊資訊 (體重/裝備/房型等)</label>
                <input type="text" id="specialInfo" class="mt-1 block w-full p-2 border border-slate-300 rounded-md">
            </div>
            
            <div class="md:col-span-6 flex justify-end mt-2 space-x-3">
                <button type="button" id="cancelEditBtn" class="hidden px-6 py-2 border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-50">
                    取消修改
                </button>
                <button type="submit" id="formSubmitBtn" class="bg-emerald-600 text-white px-8 py-2 rounded-lg font-bold hover:bg-emerald-700 transition">
                    預覽並準備存檔
                </button>
            </div>
        </form>
    </section>

    <!-- 2. 即時顯示訂單區塊 -->
    <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <section class="bg-white rounded-xl border border-emerald-200 overflow-hidden shadow-sm">
            <div class="bg-emerald-50 p-4 border-b border-emerald-100"><h3 class="text-lg font-bold text-emerald-800">📦 自營接單 (A)</h3></div>
            <div id="list-mode-a" class="p-4 space-y-4 max-h-96 overflow-y-auto no-scrollbar"></div>
        </section>
        <section class="bg-white rounded-xl border border-orange-200 overflow-hidden shadow-sm">
            <div class="bg-orange-50 p-4 border-b border-orange-100"><h3 class="text-lg font-bold text-orange-800">📤 轉給同業 (B)</h3></div>
            <div id="list-mode-b" class="p-4 space-y-4 max-h-96 overflow-y-auto no-scrollbar"></div>
        </section>
        <section class="bg-white rounded-xl border border-purple-200 overflow-hidden shadow-sm">
            <div class="bg-purple-50 p-4 border-b border-purple-100"><h3 class="text-lg font-bold text-purple-800">📥 同業轉入 (C)</h3></div>
            <div id="list-mode-c" class="p-4 space-y-4 max-h-96 overflow-y-auto no-scrollbar"></div>
        </section>
    </main>

    <!-- 3. 確認彈窗 (Modal) -->
    <div id="confirmModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full">
            <h2 class="text-2xl font-bold text-slate-800 border-b pb-3 mb-4" id="modalTitle">確認訂單資訊</h2>
            <div class="space-y-3 text-slate-700">
                <p><strong>模式：</strong> <span id="modalMode" class="text-blue-600"></span></p>
                <p><strong>姓名/單號：</strong> <span id="modalCustomer"></span></p>
                <p><strong>人數：</strong> <span id="modalPax" class="font-bold text-blue-600"></span> 人</p>
                <p><strong>出發時間：</strong> ⏰ <span id="modalDeparture" class="font-bold text-orange-600"></span></p>
                <p><strong>澳幣總額：</strong> A$ <span id="modalAud" class="font-bold"></span></p>
                <p><strong>折合台幣：</strong> NT$ <span id="modalTwd" class="font-bold text-emerald-600"></span></p>
                <p><strong>行程備註：</strong> <span id="modalNote" class="text-sm"></span></p>
                <p><strong>特殊資訊：</strong> <span id="modalSpecial" class="text-red-500 font-bold"></span></p>
            </div>
            <div class="mt-8 flex justify-end space-x-3">
                <button type="button" id="cancelBtn" class="px-5 py-2 border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-50">返回修改</button>
                <button type="button" id="confirmSaveBtn" class="px-5 py-2 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700">確認並存入</button>
            </div>
        </div>
    </div>

<script type="module">
    // 全域變數設計
    let currentEditId = null; 
    window.ordersDataMap = {}; 

    // ==========================================
    // UI 重置函式 (防呆與防當機)
    // ==========================================
    window.resetFormUI = () => {
        currentEditId = null;
        document.getElementById('orderForm').reset();
        document.getElementById('fxRate').value = '23'; 
        document.getElementById('rawOrderText').value = '';
        
        // 恢復「新增模式」外觀
        const formTitle = document.getElementById('formTitle');
        formTitle.innerText = "🆕 快速錄入新訂單";
        formTitle.classList.remove("text-orange-600");
        formTitle.classList.add("text-slate-800");

        const formSection = document.getElementById('formSection');
        formSection.classList.remove("bg-orange-50", "border-orange-300");

        const formSubmitBtn = document.getElementById('formSubmitBtn');
        formSubmitBtn.innerText = "預覽並準備存檔";
        formSubmitBtn.classList.remove("bg-orange-600", "hover:bg-orange-700");
        formSubmitBtn.classList.add("bg-emerald-600", "hover:bg-emerald-700");

        document.getElementById('cancelEditBtn').classList.add("hidden");
    };

    // --- 取消修改按鈕 ---
    document.getElementById('cancelEditBtn').addEventListener('click', () => {
        window.resetFormUI();
    });

    // ==========================================
    // 解析與攔截邏輯
    // ==========================================
    document.getElementById('parseBtn').addEventListener('click', () => {
        const rawText = document.getElementById('rawOrderText').value;
        if(!rawText) return alert("請先貼上文字");

        let mode = 'Mode_A'; 
        let customer = '';
        let aud = '';
        let special = '';
        let pax = 1;
        let note = '';
        let departureTime = ''; 
        
        const upperText = rawText.toUpperCase();
        if (upperText.includes("FLIGGY") || upperText.includes("LITTLE FOX") || upperText.includes("來自")) mode = 'Mode_B'; 
        if (rawText.includes("第三方平台") || rawText.includes("更改者資料")) mode = 'Mode_C'; 

        const nameMatch = rawText.match(/姓名[：:]\s*([^\n]+)/);
        const orderMatch = rawText.match(/訂單詳情\s*-\s*([A-Z0-9]+)/);
        
        if (nameMatch) customer = nameMatch[1].trim();
        else if (orderMatch) customer = orderMatch[1].trim();
        else if (rawText.includes("CHUANG MIN CHI")) customer = "莊閔淇 CHUANG MIN CHI"; 
        else if (rawText.includes("LIAO HSIAO CHING")) customer = "廖筱菁 LIAO HSIAO CHING";
        
        let notesArr = [];
        const detailLineMatch = rawText.match(/訂單詳情[^\n]+/);
        if (detailLineMatch) notesArr.push(detailLineMatch[0].trim()); 
        const tripMatch = rawText.match(/行程-([^\n]+)/);
        if (tripMatch) notesArr.push(tripMatch[0].trim()); 

        if (notesArr.length > 0) note = notesArr.join(" | "); 
        else note = "自動解析匯入";

        const paxMatch1 = rawText.match(/×\s*(\d+)/); 
        const paxMatch2 = rawText.match(/(\d+)\s*位/);
        const paxMatch3 = rawText.match(/人數[：:]\s*(\d+)/);

        if (paxMatch1) pax = paxMatch1[1];
        else if (paxMatch2) pax = paxMatch2[1];
        else if (paxMatch3) pax = paxMatch3[1];
        else if (rawText.includes("5大4小")) pax = 9;

        const totalMatch = rawText.match(/(?:費用|共計|總計)[^\d]*([0-9.]+)/);
        if (totalMatch) {
            aud = totalMatch[1];
        } else {
            const calcMatch = rawText.match(/=([0-9.]+)澳/);
            const genericAudMatch = rawText.match(/(?:A\$|\$)\s*([0-9.]+)/);
            if (calcMatch) aud = calcMatch[1];
            else if (genericAudMatch) aud = genericAudMatch[1];
        }

        const timeMatch1 = rawText.match(/出發時間[^\d]*([^\n]+)/); 
        const timeMatch2 = rawText.match(/(\d{1,2}月\d{1,2}號)/); 
        const timeMatch3 = rawText.match(/(\d{2}:\d{2}[am|pm]{0,2})/i); 

        if (timeMatch1) {
            departureTime = timeMatch1[1].trim();
        } else if (timeMatch2) {
            departureTime = timeMatch2[1];
            if(timeMatch3) departureTime += " " + timeMatch3[1]; 
        }

        const weightMatch = rawText.match(/(\d{2,3}kg)/i);
        if (weightMatch) special += weightMatch[1] + " ";
        
        if (rawText.includes("單板")) special += "單板 ";
        if (rawText.includes("雙板")) special += "雙板 ";
        if (rawText.includes("一大床")) special += "一大床 ";

        document.getElementById('mode').value = mode;
        if(customer) document.getElementById('customer').value = customer;
        document.getElementById('pax').value = pax;
        if(aud) document.getElementById('aud').value = aud;
        document.getElementById('note').value = note;
        document.getElementById('departureTime').value = departureTime; 
        if(special) document.getElementById('specialInfo').value = special.trim();
    });

    let pendingData = {}; 
    const modal = document.getElementById('confirmModal');

    document.getElementById('orderForm').addEventListener('submit', (e) => {
        e.preventDefault(); 
        const modeVal = document.getElementById('mode').value;
        const paxVal = parseInt(document.getElementById('pax').value) || 1;
        const audVal = parseFloat(document.getElementById('aud').value) || 0;
        const fxVal = parseFloat(document.getElementById('fxRate').value) || 23;
        const twdVal = Math.round(audVal * fxVal) || 0;

        pendingData = {
            mode: modeVal,
            customer: document.getElementById('customer').value,
            pax: paxVal, 
            aud: audVal,
            fx_rate: fxVal,
            twd: twdVal,
            departure_time: document.getElementById('departureTime').value, 
            note: document.getElementById('note').value,
            special_info: document.getElementById('specialInfo').value,
            timestamp: currentEditId ? window.ordersDataMap[currentEditId].timestamp : new Date() 
        };

        document.getElementById('modalTitle').innerText = currentEditId ? "確認更新訂單資訊" : "確認訂單資訊";
        document.getElementById('modalMode').innerText = document.getElementById('mode').options[document.getElementById('mode').selectedIndex].text;
        document.getElementById('modalCustomer').innerText = pendingData.customer;
        document.getElementById('modalPax').innerText = pendingData.pax;
        document.getElementById('modalAud').innerText = pendingData.aud;
        document.getElementById('modalTwd').innerText = pendingData.twd.toLocaleString();
        document.getElementById('modalDeparture').innerText = pendingData.departure_time || '未指定';
        document.getElementById('modalNote').innerText = pendingData.note;
        document.getElementById('modalSpecial').innerText = pendingData.special_info;

        modal.classList.remove('hidden');
    });

    document.getElementById('cancelBtn').addEventListener('click', () => modal.classList.add('hidden') );

    // ==========================================
    // 第二部分：Firebase 樂觀寫入
    // ==========================================
    
    // ⚠️ 請在這裡填寫您的 Firebase 金鑰！
    const firebaseConfig = {
        apiKey: "請填寫",
        authDomain: "請填寫",
        projectId: "請填寫",
        storageBucket: "請填寫",
        messagingSenderId: "請填寫",
        appId: "請填寫"
    };

    let db;
    let firestoreRef; 

    import("https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js").then(async (firebaseApp) => {
        firestoreRef = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
        const app = firebaseApp.initializeApp(firebaseConfig);
        db = firestoreRef.getFirestore(app);

        document.getElementById('statusText').innerText = "資料庫連線成功 🟢";
        document.getElementById('statusText').classList.replace("text-slate-500", "text-emerald-600");

        // --- 優化：移除 await 的「樂觀寫入」，絕對不會卡死！ ---
        document.getElementById('confirmSaveBtn').addEventListener('click', () => {
            const btn = document.getElementById('confirmSaveBtn');
            if(btn.disabled) return; 
            btn.disabled = true;
            btn.innerText = "寫入中...";
            
            try {
                if (currentEditId) {
                    const docRef = firestoreRef.doc(db, "orders", currentEditId);
                    // 放生執行：不需要 await 等待回傳
                    firestoreRef.updateDoc(docRef, pendingData).catch(e => console.error("Update Error:", e));
                } else {
                    firestoreRef.addDoc(firestoreRef.collection(db, "orders"), pendingData).catch(e => console.error("Add Error:", e));
                }
            } finally {
                // 不管 Firebase 怎麼跑，瞬間關閉彈窗、立刻清空表單！
                modal.classList.add('hidden'); 
                btn.innerText = "確認並存入";
                btn.disabled = false;
                window.resetFormUI();
            }
        });

        // --- 新增：刪除與修改功能 ---
        window.deleteOrder = (id) => {
            if (confirm('確定要刪除這筆資料嗎？此動作無法復原。')) {
                firestoreRef.deleteDoc(firestoreRef.doc(db, "orders", id)).catch(e => alert("刪除失敗"));
            }
        };

        window.editOrder = (id) => {
            currentEditId = id;
            const data = window.ordersDataMap[id];
            
            // 將資料填回表單
            document.getElementById('mode').value = data.mode;
            document.getElementById('customer').value = data.customer || '';
            document.getElementById('pax').value = data.pax || 1;
            document.getElementById('aud').value = data.aud || '';
            document.getElementById('fxRate').value = data.fx_rate || 23;
            document.getElementById('departureTime').value = data.departure_time || '';
            document.getElementById('note').value = data.note || '';
            document.getElementById('specialInfo').value = data.special_info || '';

            // 改變 UI 狀態，提醒現在是「修改模式」
            const formTitle = document.getElementById('formTitle');
            formTitle.innerText = "✏️ 修改訂單模式";
            formTitle.classList.remove("text-slate-800");
            formTitle.classList.add("text-orange-600");
            
            document.getElementById('formSection').classList.add("bg-orange-50", "border-orange-300");
            
            const formSubmitBtn = document.getElementById('formSubmitBtn');
            formSubmitBtn.innerText = "預覽並準備更新";
            formSubmitBtn.classList.remove("bg-emerald-600", "hover:bg-emerald-700");
            formSubmitBtn.classList.add("bg-orange-600", "hover:bg-orange-700");
            
            document.getElementById('cancelEditBtn').classList.remove("hidden");
            
            // 自動往上捲動，讓您看見表單
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // --- 即時渲染清單 ---
        const q = firestoreRef.query(firestoreRef.collection(db, "orders"), firestoreRef.orderBy("timestamp", "desc"));
        firestoreRef.onSnapshot(q, (snapshot) => {
            let htmlA = '', htmlB = '', htmlC = '';
            window.ordersDataMap = {}; // 重新整理快取

            snapshot.forEach((doc) => {
                const data = doc.data();
                window.ordersDataMap[doc.id] = data; // 存入字典供修改時使用

                const paxDisplay = data.pax ? `<span class="bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded ml-2">👤 ${data.pax}人</span>` : '';
                const timeDisplay = data.departure_time ? `<p class="text-sm font-bold text-orange-600 mt-2">⏰ 出發：${data.departure_time}</p>` : '';
                
                // 加入了懸浮的 修改/刪除 按鈕
                const cardHTML = `
                    <div class="order-card p-3 bg-slate-50 rounded-lg border border-slate-100 hover:shadow-md transition relative">
                        <div class="action-btns absolute top-2 right-2 bg-white/90 p-1 rounded shadow-sm flex space-x-2 z-10 border border-slate-200">
                            <button onclick="editOrder('${doc.id}')" title="修改" class="text-blue-600 hover:text-blue-800 px-1 text-sm font-bold">✏️ 修改</button>
                            <button onclick="deleteOrder('${doc.id}')" title="刪除" class="text-red-600 hover:text-red-800 px-1 text-sm font-bold">🗑️ 刪除</button>
                        </div>
                        
                        <p class="font-bold text-sm text-slate-800 pr-16">${data.customer} ${paxDisplay}</p>
                        ${timeDisplay}
                        <p class="text-xs text-slate-500 mt-1 break-words whitespace-pre-wrap pr-2">${data.note}</p>
                        <p class="text-xs text-red-500 mt-1">${data.special_info}</p>
                        <div class="flex justify-between items-end mt-2 border-t border-slate-200 pt-2">
                            <span class="text-xs text-slate-400">匯率 ${data.fx_rate} </span>
                            <div class="text-right">
                                <span class="font-bold text-slate-800">A$ ${data.aud}</span>
                                <p class="text-xs text-slate-500">NT$ ${data.twd.toLocaleString()}</p>
                            </div>
                        </div>
                    </div>
                `;
                if (data.mode === 'Mode_A') htmlA += cardHTML;
                if (data.mode === 'Mode_B') htmlB += cardHTML;
                if (data.mode === 'Mode_C') htmlC += cardHTML;
            });

            document.getElementById('list-mode-a').innerHTML = htmlA;
            document.getElementById('list-mode-b').innerHTML = htmlB;
            document.getElementById('list-mode-c').innerHTML = htmlC;
        });

    }).catch(err => {
        document.getElementById('statusText').innerText = "尚未設定 Firebase 金鑰或連線失敗 🔴";
        document.getElementById('statusText').classList.replace("text-slate-500", "text-red-500");
        console.error("Firebase 載入失敗:", err);
    });
</script>
</body>
</html>
