<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>澳洲旅遊調度與發票管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f1f5f9; }
        .card-shadow { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .order-card .action-btns { opacity: 0; transition: opacity 0.2s; }
        .order-card:hover .action-btns { opacity: 1; }
        .nav-btn.active { border-bottom: 4px solid #2563eb; color: #1e40af; font-weight: bold; background-color: #eff6ff; }
        
        @media print {
            .no-print { display: none !important; }
            body { background-color: white; padding: 0; }
            .card-shadow { box-shadow: none !important; border: 1px solid #e2e8f0; }
            #report-container { padding: 10px; }
            table { font-size: 12px; }
            th, td { border-bottom: 1px solid #e2e8f0; }
        }
    </style>
</head>
<body class="p-6 max-w-7xl mx-auto relative text-slate-800">

    <header class="mb-6 flex justify-between items-end no-print">
        <div>
            <h1 class="text-3xl font-bold">澳洲旅遊業務總覽</h1>
            <p class="text-slate-500 mt-1 text-sm font-bold" id="statusText">正在檢查系統狀態...</p>
        </div>
    </header>

    <nav class="flex space-x-1 border-b border-slate-300 mb-6 bg-white rounded-t-lg overflow-hidden card-shadow no-print">
        <button onclick="switchTab('dashboard')" id="tab-dashboard" class="nav-btn active flex-1 py-3 text-center text-slate-600 hover:bg-slate-50 transition">📊 首頁總覽</button>
        <button onclick="switchTab('Mode_A')" id="tab-Mode_A" class="nav-btn flex-1 py-3 text-center text-slate-600 hover:bg-slate-50 transition">📦 自營接單 (A)</button>
        <button onclick="switchTab('Mode_B')" id="tab-Mode_B" class="nav-btn flex-1 py-3 text-center text-slate-600 hover:bg-slate-50 transition">📤 轉給同業 (B)</button>
        <button onclick="switchTab('Mode_C')" id="tab-Mode_C" class="nav-btn flex-1 py-3 text-center text-slate-600 hover:bg-slate-50 transition">📥 同業轉入 (C)</button>
        <button onclick="switchTab('report')" id="tab-report" class="nav-btn flex-1 py-3 text-center text-slate-600 hover:bg-slate-50 transition">📈 報表查詢</button>
    </nav>

    <div id="inputSection" class="no-print">
        <section class="mb-6 bg-blue-50 p-5 rounded-xl border border-blue-200 shadow-sm">
            <h2 class="text-base font-bold text-blue-800 mb-2">⚡ 智慧文字解析 (貼上 LINE 訂單)</h2>
            <textarea id="rawOrderText" rows="3" class="w-full p-2 border border-blue-300 rounded-md text-sm focus:ring-blue-500" placeholder="在此貼上 LINE 群組的原始文字訂單..."></textarea>
            <div class="mt-2 flex justify-end">
                <button type="button" id="parseBtn" class="bg-blue-600 text-white px-5 py-1.5 rounded-lg font-bold text-sm hover:bg-blue-700 transition">自動解析欄位 ↓</button>
            </div>
        </section>

        <section class="mb-8 bg-white p-5 rounded-xl border border-slate-200 card-shadow transition-colors duration-300" id="formSection">
            <h2 id="formTitle" class="text-lg font-bold text-slate-800 mb-3">🆕 快速錄入新訂單</h2>
            <form id="orderForm" class="grid grid-cols-1 md:grid-cols-8 gap-3">
                <div class="md:col-span-2">
                    <label class="block text-xs font-medium text-slate-700">經營模式</label>
                    <select id="mode" class="mt-1 block w-full p-2 border border-slate-300 rounded-md bg-slate-50 text-sm" required>
                        <option value="Mode_A">Mode A: 自營自出</option>
                        <option value="Mode_B">Mode B: 轉給同業</option>
                        <option value="Mode_C">Mode C: 同業轉入</option>
                    </select>
                </div>
                <div class="md:col-span-3">
                    <label class="block text-xs font-medium text-slate-700">旅客姓名/單號</label>
                    <input type="text" id="customer" class="mt-1 block w-full p-2 border border-slate-300 rounded-md text-sm" required>
                </div>
                <div class="md:col-span-3">
                    <label class="block text-xs font-medium text-slate-700">出發時間</label>
                    <input type="text" id="departureTime" placeholder="YYYY-MM-DD" class="mt-1 block w-full p-2 border border-slate-300 rounded-md bg-yellow-50 focus:bg-white text-sm font-bold text-slate-800">
                </div>
                
                <div class="md:col-span-2">
                    <label class="block text-xs font-medium text-slate-700">幣別</label>
                    <select id="currency" class="mt-1 block w-full p-2 border border-slate-300 rounded-md bg-slate-50 text-sm font-bold text-blue-700" onchange="handleCurrencyChange()">
                        <option value="AUD">🇦🇺 澳幣 (AUD)</option>
                        <option value="CNY">🇨🇳 人民幣 (CNY)</option>
                        <option value="TWD">🇹🇼 台幣 (TWD)</option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-medium text-slate-700">單價</label>
                    <input type="number" step="0.01" id="unitPrice" placeholder="有單價會自動乘" class="mt-1 block w-full p-2 border border-slate-300 rounded-md text-sm">
                </div>
                <div class="md:col-span-1">
                    <label class="block text-xs font-medium text-slate-700">人數 (Pax)</label>
                    <input type="number" id="pax" value="1" min="1" class="mt-1 block w-full p-2 border border-slate-300 rounded-md text-sm" required>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-medium text-slate-700">總額</label>
                    <input type="number" step="0.01" id="amount" class="mt-1 block w-full p-2 border border-blue-400 bg-blue-50 font-bold rounded-md text-sm" required>
                </div>
                <div class="md:col-span-1">
                    <label class="block text-xs font-medium text-slate-700">匯率</label>
                    <input type="number" step="0.001" id="fxRate" value="23" class="mt-1 block w-full p-2 border border-slate-300 rounded-md text-sm" required>
                </div>

                <div class="md:col-span-2">
                    <label class="block text-xs font-medium text-slate-700">成本 (預設0)</label>
                    <input type="number" step="0.01" id="cost" value="0" class="mt-1 block w-full p-2 border border-red-300 bg-red-50 text-red-700 font-bold rounded-md text-sm" required>
                </div>
                <div class="md:col-span-3">
                    <label class="block text-xs font-medium text-slate-700">收款狀態</label>
                    <select id="paymentStatus" class="mt-1 block w-full p-2 border border-slate-300 rounded-md bg-slate-50 text-sm" required>
                        <option value="unpaid">❌ 未收款 (Pending)</option>
                        <option value="paid">✅ 已收款 (Paid)</option>
                    </select>
                </div>
                <div class="md:col-span-3">
                    <label class="block text-xs font-medium text-slate-700">結案狀態</label>
                    <select id="caseStatus" class="mt-1 block w-full p-2 border border-slate-300 rounded-md bg-slate-50 text-sm" required>
                        <option value="open">⏳ 未結案 (Open)</option>
                        <option value="closed">📁 已結案 (Closed)</option>
                    </select>
                </div>

                <div class="md:col-span-5">
                    <label class="block text-xs font-medium text-slate-700">行程詳情 / 備註 (包含金流)</label>
                    <textarea id="note" rows="2" class="mt-1 block w-full p-2 border border-slate-300 rounded-md text-sm"></textarea>
                </div>
                <div class="md:col-span-3">
                    <label class="block text-xs font-medium text-slate-700">特殊資訊 (體重/裝備/房型等)</label>
                    <input type="text" id="specialInfo" class="mt-1 block w-full p-2 border border-slate-300 rounded-md text-sm">
                </div>
                
                <div class="md:col-span-8 flex justify-end mt-1 space-x-3">
                    <button type="button" id="cancelEditBtn" class="hidden px-5 py-2 border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-50 text-sm">取消修改</button>
                    <button type="submit" id="formSubmitBtn" class="bg-emerald-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-emerald-700 transition text-sm">預覽並準備存檔</button>
                </div>
            </form>
        </section>
    </div>

    <main id="view-dashboard" class="view-section grid grid-cols-1 lg:grid-cols-3 gap-6 no-print">
        <section class="bg-white rounded-xl border border-emerald-200 overflow-hidden shadow-sm flex flex-col max-h-[800px]">
            <div class="bg-emerald-50 p-3 border-b border-emerald-100 flex-shrink-0"><h3 class="font-bold text-emerald-800">📦 自營接單 (A)</h3></div>
            <div id="dash-mode-a" class="p-4 space-y-4 overflow-y-auto no-scrollbar flex-grow"></div>
        </section>
        <section class="bg-white rounded-xl border border-orange-200 overflow-hidden shadow-sm flex flex-col max-h-[800px]">
            <div class="bg-orange-50 p-3 border-b border-orange-100 flex-shrink-0"><h3 class="font-bold text-orange-800">📤 轉給同業 (B)</h3></div>
            <div id="dash-mode-b" class="p-4 space-y-4 overflow-y-auto no-scrollbar flex-grow"></div>
        </section>
        <section class="bg-white rounded-xl border border-purple-200 overflow-hidden shadow-sm flex flex-col max-h-[800px]">
            <div class="bg-purple-50 p-3 border-b border-purple-100 flex-shrink-0"><h3 class="font-bold text-purple-800">📥 同業轉入 (C)</h3></div>
            <div id="dash-mode-c" class="p-4 space-y-4 overflow-y-auto no-scrollbar flex-grow"></div>
        </section>
    </main>

    <main id="view-single-mode" class="view-section hidden no-print">
        <section class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
            <div class="bg-slate-100 p-4 border-b border-slate-200 flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-800" id="single-mode-title">模式列表</h3>
            </div>
            <div id="single-mode-list" class="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </section>
    </main>

    <main id="view-report" class="view-section hidden">
        <div class="flex flex-wrap gap-3 mb-4 items-center bg-white p-4 rounded-xl border border-slate-200 shadow-sm no-print">
            <h3 class="font-bold text-slate-800 mr-4">⚙️ 報表設定</h3>
            
            <select id="reportTimeType" class="p-2 border border-slate-300 rounded text-sm bg-slate-50" onchange="toggleDateInputs(); updateReportHeader(); renderUI()">
                <option value="all">顯示全部出發時間</option>
                <option value="month">📅 出發月報表</option>
                <option value="day">📆 出發日報表</option>
            </select>
            <input type="month" id="monthPicker" class="hidden p-2 border border-slate-300 rounded text-sm" onchange="updateReportHeader(); renderUI()">
            <input type="date" id="datePicker" class="hidden p-2 border border-slate-300 rounded text-sm" onchange="updateReportHeader(); renderUI()">
            
            <select id="reportModeFilter" class="p-2 border border-slate-300 rounded text-sm bg-slate-50 ml-auto" onchange="renderUI()">
                <option value="all">模式：全部</option>
                <option value="Mode_A">📦 自營接單 (A)</option>
                <option value="Mode_B">📤 轉給同業 (B)</option>
                <option value="Mode_C">📥 同業轉入 (C)</option>
            </select>

            <select id="reportFilter" class="p-2 border border-slate-300 rounded text-sm bg-slate-50" onchange="renderUI()">
                <option value="all">結案狀態：全部</option>
                <option value="open">⏳ 只顯示未結案</option>
                <option value="closed">📁 只顯示已結案</option>
            </select>

            <button onclick="window.print()" class="px-4 py-2 border border-slate-800 text-slate-800 font-bold rounded hover:bg-slate-100 text-sm transition">🖨️ 列印</button>
            <button onclick="exportToImage()" class="px-4 py-2 bg-blue-600 text-white font-bold rounded hover:bg-blue-700 text-sm transition">📸 下載圖片</button>
        </div>

        <div id="report-container" class="bg-white rounded-xl overflow-hidden p-2">
            <h2 id="reportHeaderTitle" class="text-2xl font-bold text-center text-slate-800 py-4 hidden print:block">澳洲旅遊業務出發報表 (全部出發時間)</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="bg-slate-50 p-5 rounded-xl border border-slate-200 border-l-4 border-l-blue-500">
                    <p class="text-sm text-slate-500 mb-1">符合條件訂單數</p>
                    <h3 class="text-3xl font-bold text-slate-800" id="rep-total-count">0</h3>
                </div>
                <div class="bg-slate-50 p-5 rounded-xl border border-slate-200 border-l-4 border-l-red-500">
                    <p class="text-sm text-slate-500 mb-1">❌ 未收款總額</p>
                    <h3 class="text-3xl font-bold text-red-600" id="rep-unpaid-sum">NT$ 0</h3>
                </div>
                <div class="bg-slate-50 p-5 rounded-xl border border-slate-200 border-l-4 border-l-emerald-500">
                    <p class="text-sm text-slate-500 mb-1">✅ 已收款總額</p>
                    <h3 class="text-3xl font-bold text-emerald-600" id="rep-paid-sum">NT$ 0</h3>
                </div>
            </div>

            <div class="border border-slate-200 rounded-lg overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-800 text-white">
                            <th class="p-3">雙狀態</th>
                            <th class="p-3">模式</th>
                            <th class="p-3">姓名/單號</th>
                            <th class="p-3">出發時間</th>
                            <th class="p-3 text-right">金額明細 (含成本)</th>
                            <th class="p-3 text-center no-print">操作</th>
                        </tr>
                    </thead>
                    <tbody id="report-table-body" class="divide-y divide-slate-200 bg-white">
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="confirmModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center backdrop-blur-sm no-print">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full">
            <h2 class="text-xl font-bold text-slate-800 border-b pb-3 mb-4" id="modalTitle">確認訂單資訊</h2>
            <div class="space-y-2 text-slate-700 text-sm">
                <p><strong>模式：</strong> <span id="modalMode" class="text-blue-600"></span></p>
                <p><strong>姓名/單號：</strong> <span id="modalCustomer"></span></p>
                <p><strong>單價與人數：</strong> <span id="modalUnitPax" class="font-bold text-blue-600"></span></p>
                <p><strong>出發時間：</strong> ⏰ <span id="modalDeparture" class="font-bold text-orange-600"></span></p>
                <div class="flex space-x-4">
                    <p><strong>總額：</strong> <span id="modalAmount" class="font-bold text-lg"></span></p>
                    <p class="text-red-600"><strong>成本：</strong> <span id="modalCost" class="font-bold text-lg"></span></p>
                </div>
                <p><strong>折合台幣：</strong> NT$ <span id="modalTwd" class="font-bold text-emerald-600 text-lg"></span></p>
                <div class="flex space-x-4 mt-2">
                    <p><strong>收款：</strong> <span id="modalPaymentStatus"></span></p>
                    <p><strong>結案：</strong> <span id="modalCaseStatus"></span></p>
                </div>
                <div class="bg-slate-100 p-2 rounded text-xs whitespace-pre-wrap max-h-24 overflow-y-auto mt-2" id="modalNote"></div>
            </div>
            <div class="mt-6 flex justify-end space-x-3">
                <button type="button" id="cancelBtn" class="px-4 py-2 border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-50">返回</button>
                <button type="button" id="confirmSaveBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700">確認並存入</button>
            </div>
        </div>
    </div>

<script type="module">
    window.currentTab = 'dashboard';
    window.allOrders = []; 

    window.getTodayFormatted = () => {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    };

    document.getElementById('departureTime').value = window.getTodayFormatted();

    window.handleCurrencyChange = () => {
        const curr = document.getElementById('currency').value;
        const fxInput = document.getElementById('fxRate');
        if (curr === 'AUD') { fxInput.value = 23; fxInput.disabled = false; } 
        else if (curr === 'CNY') { fxInput.value = 4.65; fxInput.disabled = false; } 
        else if (curr === 'TWD') { fxInput.value = 1; fxInput.disabled = true; }
        calculateTotal();
    };

    const calculateTotal = () => {
        const unit = parseFloat(document.getElementById('unitPrice').value);
        const pax = parseInt(document.getElementById('pax').value) || 1;
        if (!isNaN(unit)) {
            document.getElementById('amount').value = (unit * pax).toFixed(2);
        }
    };
    document.getElementById('unitPrice').addEventListener('input', calculateTotal);
    document.getElementById('pax').addEventListener('input', calculateTotal);

    window.switchTab = (tabName) => {
        window.currentTab = tabName;
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tab-${tabName}`).classList.add('active');
        document.querySelectorAll('.view-section').forEach(view => view.classList.add('hidden'));

        const inputSec = document.getElementById('inputSection');
        if (tabName === 'report') inputSec.classList.add('hidden');
        else {
            inputSec.classList.remove('hidden');
            if (['Mode_A', 'Mode_B', 'Mode_C'].includes(tabName)) document.getElementById('mode').value = tabName;
        }

        if (tabName === 'dashboard') document.getElementById('view-dashboard').classList.remove('hidden');
        else if (tabName === 'report') document.getElementById('view-report').classList.remove('hidden');
        else {
            document.getElementById('view-single-mode').classList.remove('hidden');
            const titles = { Mode_A: "📦 自營接單 (A)", Mode_B: "📤 轉給同業 (B)", Mode_C: "📥 同業轉入 (C)" };
            document.getElementById('single-mode-title').innerText = titles[tabName];
        }
        window.renderUI(); 
    };

    window.updateReportHeader = () => {
        const type = document.getElementById('reportTimeType').value;
        const mp = document.getElementById('monthPicker').value;
        const dp = document.getElementById('datePicker').value;
        const header = document.getElementById('reportHeaderTitle');
        if (type === 'all') header.innerText = "澳洲旅遊業務出發報表 (全部出發時間)";
        else if (type === 'month') header.innerText = `澳洲旅遊業務出發月報表 (${mp})`;
        else if (type === 'day') header.innerText = `澳洲旅遊業務出發日報表 (${dp})`;
    };

    window.toggleDateInputs = () => {
        const type = document.getElementById('reportTimeType').value;
        const mp = document.getElementById('monthPicker');
        const dp = document.getElementById('datePicker');
        mp.classList.toggle('hidden', type !== 'month');
        dp.classList.toggle('hidden', type !== 'day');
        
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        if(type === 'month' && !mp.value) mp.value = `${yyyy}-${mm}`;
        if(type === 'day' && !dp.value) dp.value = `${yyyy}-${mm}-${dd}`;
    };

    window.exportToImage = () => {
        const container = document.getElementById('report-container');
        document.getElementById('reportHeaderTitle').classList.remove('hidden'); 
        const noPrintElements = container.querySelectorAll('.no-print');
        noPrintElements.forEach(el => el.style.display = 'none');

        html2canvas(container, { scale: 2, backgroundColor: '#ffffff' }).then(canvas => {
            const link = document.createElement('a');
            const type = document.getElementById('reportTimeType').value;
            let dateSuffix = '全部';
            if (type === 'month') dateSuffix = document.getElementById('monthPicker').value;
            else if (type === 'day') dateSuffix = document.getElementById('datePicker').value;

            link.download = `旅遊財務出發報表_${dateSuffix}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            document.getElementById('reportHeaderTitle').classList.add('hidden');
            noPrintElements.forEach(el => el.style.display = '');
        });
    };

    window.resetFormUI = () => {
        window.currentEditId = null;
        document.getElementById('orderForm').reset();
        
        document.getElementById('currency').value = 'AUD';
        window.handleCurrencyChange();
        
        document.getElementById('rawOrderText').value = '';
        document.getElementById('departureTime').value = window.getTodayFormatted(); 
        
        document.getElementById('cost').value = '0';
        document.getElementById('paymentStatus').value = 'unpaid';
        document.getElementById('caseStatus').value = 'open';

        if (['Mode_A', 'Mode_B', 'Mode_C'].includes(window.currentTab)) document.getElementById('mode').value = window.currentTab;

        const formTitle = document.getElementById('formTitle');
        formTitle.innerText = "🆕 快速錄入新訂單";
        formTitle.classList.replace("text-orange-600", "text-slate-800");
        document.getElementById('formSection').classList.remove("bg-orange-50", "border-orange-300");
        const formSubmitBtn = document.getElementById('formSubmitBtn');
        formSubmitBtn.innerText = "預覽並準備存檔";
        formSubmitBtn.classList.replace("bg-orange-600", "bg-emerald-600");
        document.getElementById('cancelEditBtn').classList.add("hidden");
    };

    document.getElementById('cancelEditBtn').addEventListener('click', window.resetFormUI);

    document.getElementById('parseBtn').addEventListener('click', () => {
        const rawText = document.getElementById('rawOrderText').value;
        if(!rawText) return alert("請先貼上文字");

        let mode = document.getElementById('mode').value; 
        let customer = ''; let amount = ''; let special = ''; let pax = 1; let note = ''; let departureTime = window.getTodayFormatted(); let unitPrice = '';
        let currency = 'AUD';
        
        const upperText = rawText.toUpperCase();
        if (upperText.includes("FLIGGY") || upperText.includes("LITTLE FOX")) mode = 'Mode_B'; 
        if (rawText.includes("第三方平台") || rawText.includes("更改者資料")) mode = 'Mode_C'; 
        if (rawText.includes("我的預訂網站")) mode = 'Mode_A';

        if (upperText.includes("RMB") || upperText.includes("人民幣") || rawText.includes("¥")) currency = 'CNY';
        if (upperText.includes("NT$") || upperText.includes("TWD") || upperText.includes("台幣")) currency = 'TWD';

        const nameMatch = rawText.match(/(?:姓名|客戶姓名)[：:-]\s*([^\n]+)/);
        const orderMatch = rawText.match(/訂單詳情\s*-\s*([A-Z0-9]+)/);
        if (nameMatch) customer = nameMatch[1].trim();
        else if (orderMatch) customer = orderMatch[1].trim();
        else if (rawText.includes("CHUANG MIN CHI")) customer = "莊閔淇 CHUANG MIN CHI"; 
        else if (rawText.includes("LIAO HSIAO CHING")) customer = "廖筱菁 LIAO HSIAO CHING";
        
        let notesArr = [];
        const detailMatch = rawText.match(/訂單詳情[^\n]+/);
        if (detailMatch) notesArr.push(detailMatch[0].trim()); 
        const tripMatch = rawText.match(/行程-([^\n]+)/);
        if (tripMatch) notesArr.push(tripMatch[0].trim()); 
        const paymentMatch = rawText.match(/(付款方式-[^]*)/);
        if (paymentMatch) notesArr.push("\n---金流---\n" + paymentMatch[1].trim());

        note = notesArr.length > 0 ? notesArr.join("\n") : "自動解析匯入";

        const unitPaxMatch = rawText.match(/(?:A\$|\$|¥|RMB|NT\$|人民幣)\s*([0-9.]+)\s*[xX×*]\s*(\d+)/);
        if (unitPaxMatch) {
            unitPrice = unitPaxMatch[1];
            pax = unitPaxMatch[2];
            amount = (parseFloat(unitPrice) * parseInt(pax)).toFixed(2);
        } else {
            const paxMatch = rawText.match(/(\d+)\s*位/) || rawText.match(/人數[：:]\s*(\d+)/);
            if (paxMatch) pax = paxMatch[1]; else if (rawText.includes("5大4小")) pax = 9;
            const totalMatch = rawText.match(/(?:費用|共計|總計)[^\d]*([0-9.]+)/) || rawText.match(/=([0-9.]+)[澳元塊]/) || rawText.match(/(?:A\$|\$|¥|RMB|NT\$)\s*([0-9.]+)/);
            if (totalMatch) amount = totalMatch[1];
        }

        const dateRegex = /([0-9]{4})[-/年]([0-9]{1,2})[-/月]([0-9]{1,2})[日號]?|([0-9]{1,2})[-/月]([0-9]{1,2})[日號]?/;
        const depLine = rawText.match(/出發(?:時間|日期)[^\n]+/);
        const dateLine = rawText.match(/日期[：:-][^\n]+/);
        let targetLine = (depLine ? depLine[0] : null) || (dateLine ? dateLine[0] : null);
        let dateMatch;
        
        if (targetLine) dateMatch = targetLine.match(dateRegex);
        else dateMatch = rawText.match(dateRegex); 

        if (dateMatch) {
            let y, m, d;
            if (dateMatch[1]) { 
                y = dateMatch[1]; m = dateMatch[2]; d = dateMatch[3];
            } else if (dateMatch[4]) { 
                y = new Date().getFullYear(); m = dateMatch[4]; d = dateMatch[5];
            }
            if (m && d) departureTime = `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
            if (targetLine) {
                const timeStrMatch = targetLine.match(/([0-2]?[0-9]:[0-5][0-9](?:[aApP][mM])?)/i);
                if (timeStrMatch) departureTime += " " + timeStrMatch[1];
            }
        }

        const weightMatch = rawText.match(/(\d{2,3}kg)/i);
        if (weightMatch) special += weightMatch[1] + " ";

        document.getElementById('mode').value = mode;
        if(customer) document.getElementById('customer').value = customer;
        document.getElementById('pax').value = pax;
        
        document.getElementById('currency').value = currency;
        window.handleCurrencyChange();

        document.getElementById('unitPrice').value = unitPrice; 
        if(amount) document.getElementById('amount').value = amount;
        
        document.getElementById('note').value = note;
        document.getElementById('departureTime').value = departureTime; 
        if(special) document.getElementById('specialInfo').value = special.trim();
    });

    let pendingData = {}; 
    const modal = document.getElementById('confirmModal');

    document.getElementById('orderForm').addEventListener('submit', (e) => {
        e.preventDefault(); 
        const modeVal = document.getElementById('mode').value;
        const currencyVal = document.getElementById('currency').value;
        const paxVal = parseInt(document.getElementById('pax').value) || 1;
        const unitVal = parseFloat(document.getElementById('unitPrice').value) || null;
        const amountVal = parseFloat(document.getElementById('amount').value) || 0;
        const fxVal = parseFloat(document.getElementById('fxRate').value) || 1;
        const twdVal = Math.round(amountVal * fxVal) || 0;
        
        const costVal = parseFloat(document.getElementById('cost').value) || 0;
        const paymentStatusVal = document.getElementById('paymentStatus').value;
        const caseStatusVal = document.getElementById('caseStatus').value;

        const existingOrder = window.currentEditId ? window.allOrders.find(o => o.id === window.currentEditId) : null;
        const currentTimestamp = existingOrder ? existingOrder.data.timestamp : new Date();

        pendingData = {
            mode: modeVal,
            customer: document.getElementById('customer').value,
            pax: paxVal,
            currency: currencyVal,
            unit_price: unitVal, 
            amount: amountVal,
            aud: amountVal,
            fx_rate: fxVal,
            twd: twdVal,
            cost: costVal,
            payment_status: paymentStatusVal,
            case_status: caseStatusVal,
            departure_time: document.getElementById('departureTime').value, 
            note: document.getElementById('note').value,
            special_info: document.getElementById('specialInfo').value,
            status: 'completed', // 保留舊的status避免錯誤，主要使用雙狀態
            timestamp: currentTimestamp 
        };

        const currSymbol = { AUD: 'A$', CNY: '¥', TWD: 'NT$' }[currencyVal] || 'A$';

        document.getElementById('modalTitle').innerText = window.currentEditId ? "確認更新訂單" : "確認新增訂單";
        document.getElementById('modalMode').innerText = document.getElementById('mode').options[document.getElementById('mode').selectedIndex].text;
        document.getElementById('modalCustomer').innerText = pendingData.customer;
        document.getElementById('modalUnitPax').innerText = unitVal ? `單價 ${currSymbol} ${unitVal} × ${paxVal} 人` : `${paxVal} 人`;
        document.getElementById('modalAmount').innerText = `${currSymbol} ${amountVal}`;
        document.getElementById('modalCost').innerText = `${currSymbol} ${costVal}`;
        document.getElementById('modalTwd').innerText = pendingData.twd.toLocaleString();
        document.getElementById('modalPaymentStatus').innerText = paymentStatusVal === 'paid' ? '✅ 已收款' : '❌ 未收款';
        document.getElementById('modalCaseStatus').innerText = caseStatusVal === 'closed' ? '📁 已結案' : '⏳ 未結案';
        document.getElementById('modalDeparture').innerText = pendingData.departure_time || '未指定';
        document.getElementById('modalNote').innerText = pendingData.note;

        modal.classList.remove('hidden');
    });

    document.getElementById('cancelBtn').addEventListener('click', () => modal.classList.add('hidden') );

    // ==========================================
    // 第二部分：Firebase 與畫面渲染引擎
    // ==========================================
const firebaseConfig = {
  apiKey: "AIzaSyCBKoPGs0TW6VI1Ws3-61USpjARQR-O8Mc",
  authDomain: "aus-travel-system.firebaseapp.com",
  projectId: "aus-travel-system",
  storageBucket: "aus-travel-system.firebasestorage.app",
  messagingSenderId: "733398393106",
  appId: "1:733398393106:web:370b0717ef760be29953cb",
  measurementId: "G-2CPJ8HH5PC"
};

    let db;
    let firestoreRef; 

    const getTimestampMs = (ts) => {
        if (!ts) return 0;
        if (ts.toMillis) return ts.toMillis();
        if (ts.toDate) return ts.toDate().getTime();
        if (ts.seconds) return ts.seconds * 1000;
        return new Date(ts).getTime();
    };

    const generateCardHTML = (doc) => {
        const data = doc.data;
        
        const isPaid = (data.payment_status === 'paid') || (!data.payment_status && data.status === 'completed');
        const isClosed = (data.case_status === 'closed') || (!data.case_status && data.status === 'completed');
        
        const paymentBadge = isPaid 
            ? `<span class="bg-emerald-100 text-emerald-800 text-xs px-2 py-0.5 rounded mr-1 shadow-sm">✅ 已收款</span>` 
            : `<span class="bg-red-100 text-red-800 text-xs px-2 py-0.5 rounded mr-1 shadow-sm">❌ 未收款</span>`;
            
        const caseBadge = isClosed 
            ? `<span class="bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded mr-2 shadow-sm">📁 已結案</span>` 
            : `<span class="bg-yellow-100 text-yellow-800 text-xs px-2 py-0.5 rounded mr-2 shadow-sm">⏳ 未結案</span>`;
            
        const paxDisplay = data.pax ? `<span class="bg-slate-200 text-slate-700 font-bold text-xs px-2 py-0.5 rounded">👤 ${data.pax}</span>` : '';
        const timeDisplay = data.departure_time ? `<p class="text-sm font-bold text-orange-600 mt-1">⏰ 出發：${data.departure_time}</p>` : '';
        
        const currType = data.currency || 'AUD';
        const sym = { AUD: 'A$', CNY: '¥', TWD: 'NT$' }[currType] || 'A$';
        const displayAmount = data.amount || data.aud || 0;
        const displayCost = data.cost || 0;
        
        const unitDisplay = data.unit_price ? `<span class="text-[10px] font-bold text-blue-500 block leading-tight mb-0.5">${sym} ${data.unit_price} × ${data.pax}</span>` : '';

        return `
            <div class="order-card p-4 bg-white rounded-lg border border-slate-200 hover:border-blue-400 transition shadow-sm relative group">
                <div class="action-btns absolute top-2 right-2 bg-white/95 p-1.5 rounded-lg shadow-md flex space-x-2 z-10 border border-slate-200">
                    <button onclick="togglePayment('${doc.id}', '${isPaid ? 'paid' : 'unpaid'}')" title="切換收款狀態" class="text-slate-600 hover:text-emerald-600 text-xs font-bold transition">💲收款</button>
                    <button onclick="toggleCase('${doc.id}', '${isClosed ? 'closed' : 'open'}')" title="切換結案狀態" class="text-slate-600 hover:text-blue-600 text-xs font-bold transition">📁結案</button>
                    <button onclick="editOrder('${doc.id}')" title="修改" class="text-slate-400 hover:text-orange-500 transition">✏️</button>
                    <button onclick="deleteOrder('${doc.id}')" title="刪除" class="text-slate-400 hover:text-red-500 transition">🗑️</button>
                </div>
                
                <div class="flex items-center mb-2 pr-32 flex-wrap gap-y-1">${paymentBadge} ${caseBadge} ${paxDisplay}</div>
                
                <p class="font-bold text-base text-slate-800 leading-tight">${data.customer}</p>
                ${timeDisplay}
                
                <div class="bg-slate-50 border border-slate-100 rounded p-2 mt-2 max-h-20 overflow-y-auto text-xs text-slate-600 whitespace-pre-wrap">${data.note}</div>
                <p class="text-xs text-red-500 mt-1 font-bold">${data.special_info || ''}</p>
                
                <div class="flex justify-between items-end mt-3 border-t border-slate-100 pt-2">
                    <div class="text-left">
                        <span class="text-[10px] text-slate-400 block mb-0.5">匯率 ${data.fx_rate} </span>
                        <span class="text-xs text-red-500 font-bold bg-red-50 px-1.5 py-0.5 rounded border border-red-100">成本: ${sym} ${displayCost}</span>
                    </div>
                    <div class="text-right">
                        ${unitDisplay}
                        <span class="font-bold text-slate-800 text-base">${sym} ${displayAmount}</span>
                        <p class="text-[11px] text-slate-500 font-bold">NT$ ${data.twd.toLocaleString()}</p>
                    </div>
                </div>
            </div>
        `;
    };

    window.renderUI = () => {
        document.getElementById('dash-mode-a').innerHTML = '';
        document.getElementById('dash-mode-b').innerHTML = '';
        document.getElementById('dash-mode-c').innerHTML = '';
        document.getElementById('single-mode-list').innerHTML = '';
        document.getElementById('report-table-body').innerHTML = '';

        window.allOrders.sort((a, b) => getTimestampMs(b.data.timestamp) - getTimestampMs(a.data.timestamp));

        let reportCount = 0;
        let totalUnpaid = 0;
        let totalPaid = 0;
        let reportRows = []; 
        
        const reportStatus = document.getElementById('reportFilter') ? document.getElementById('reportFilter').value : 'all';
        const reportTimeType = document.getElementById('reportTimeType') ? document.getElementById('reportTimeType').value : 'all';
        const reportMode = document.getElementById('reportModeFilter') ? document.getElementById('reportModeFilter').value : 'all';
        
        const targetMonth = document.getElementById('monthPicker') ? document.getElementById('monthPicker').value : '';
        const targetDate = document.getElementById('datePicker') ? document.getElementById('datePicker').value : '';

        window.allOrders.forEach((doc) => {
            const data = doc.data;
            const cardHTML = generateCardHTML(doc);

            if (window.currentTab === 'dashboard') {
                if (data.mode === 'Mode_A') document.getElementById('dash-mode-a').innerHTML += cardHTML;
                if (data.mode === 'Mode_B') document.getElementById('dash-mode-b').innerHTML += cardHTML;
                if (data.mode === 'Mode_C') document.getElementById('dash-mode-c').innerHTML += cardHTML;
            }
            if (['Mode_A', 'Mode_B', 'Mode_C'].includes(window.currentTab) && data.mode === window.currentTab) {
                document.getElementById('single-mode-list').innerHTML += cardHTML;
            }

            if (window.currentTab === 'report') {
                const isPaid = (data.payment_status === 'paid') || (!data.payment_status && data.status === 'completed');
                const isClosed = (data.case_status === 'closed') || (!data.case_status && data.status === 'completed');
                
                const passStatus = (reportStatus === 'all') || (reportStatus === 'open' && !isClosed) || (reportStatus === 'closed' && isClosed);
                const passMode = (reportMode === 'all') || (data.mode === reportMode);
                
                let passTime = true;
                if (reportTimeType !== 'all') {
                    const dep = data.departure_time || "";
                    if (reportTimeType === 'month' && targetMonth) {
                        const mm = targetMonth.split('-')[1]; 
                        const m = parseInt(mm, 10).toString(); 
                        passTime = dep.includes(targetMonth) || dep.includes(`-${mm}-`) || dep.includes(`${m}月`);
                    } 
                    else if (reportTimeType === 'day' && targetDate) {
                        const parts = targetDate.split('-');
                        const mm = parts[1]; const dd = parts[2];
                        const m = parseInt(mm, 10).toString(); const d = parseInt(dd, 10).toString();
                        passTime = dep.includes(targetDate) || dep.includes(`${mm}-${dd}`) || dep.includes(`${mm}/${dd}`) || dep.includes(`${m}月${d}號`) || dep.includes(`${m}月${d}日`);
                    }
                }

                if (passStatus && passTime && passMode) {
                    reportCount++;
                    if (isPaid) totalPaid += (data.twd || 0);
                    else totalUnpaid += (data.twd || 0);
                    reportRows.push(doc);
                }
            }
        });

        if (window.currentTab === 'report') {
            reportRows.sort((a, b) => {
                const dateA = a.data.departure_time || "9999-12-31";
                const dateB = b.data.departure_time || "9999-12-31";
                return dateA.localeCompare(dateB); 
            });

            reportRows.forEach(doc => {
                const data = doc.data;
                const isPaid = (data.payment_status === 'paid') || (!data.payment_status && data.status === 'completed');
                const isClosed = (data.case_status === 'closed') || (!data.case_status && data.status === 'completed');
                
                const paymentStr = isPaid ? '<span class="text-emerald-600 font-bold block mb-1 text-[11px]">✅ 已收款</span>' : '<span class="text-red-500 font-bold block mb-1 text-[11px]">❌ 未收款</span>';
                const caseStr = isClosed ? '<span class="text-blue-600 font-bold block text-[11px]">📁 已結案</span>' : '<span class="text-yellow-600 font-bold block text-[11px]">⏳ 未結案</span>';
                
                const modeMap = { Mode_A: "自營", Mode_B: "轉出", Mode_C: "轉入" };
                
                const currType = data.currency || 'AUD';
                const sym = { AUD: 'A$', CNY: '¥', TWD: 'NT$' }[currType] || 'A$';
                const displayAmount = data.amount || data.aud || 0;
                const displayCost = data.cost || 0;

                const cleanNote = (data.note || '無備註').replace(/"/g, '&quot;');
                const cleanSpecial = data.special_info ? `\n\n⚠️ 特殊資訊：\n${data.special_info}`.replace(/"/g, '&quot;') : '';
                const hoverText = `📝 行程與金流備註：\n------------------------\n${cleanNote}${cleanSpecial}`;

                const unitTableDisplay = data.unit_price ? `<span class="text-[10px] text-blue-500 font-bold block leading-tight mt-1 mb-1">${sym} ${data.unit_price} × ${data.pax}</span>` : '';

                document.getElementById('report-table-body').innerHTML += `
                    <tr class="hover:bg-slate-50 border-b border-slate-200 transition cursor-help" title="${hoverText}">
                        <td class="p-3 leading-tight">${paymentStr}${caseStr}</td>
                        <td class="p-3 text-xs text-slate-500">${modeMap[data.mode]}</td>
                        <td class="p-3 font-bold text-sm">
                            ${data.customer} <span class="text-[10px] text-slate-400">(${data.pax}人)</span>
                            <div class="mt-1 no-print">
                                <span class="inline-flex items-center text-[10px] bg-blue-50 text-blue-600 border border-blue-200 px-1.5 py-0.5 rounded shadow-sm">
                                    💬 停駐看備註
                                </span>
                            </div>
                        </td>
                        <td class="p-3 text-orange-600 font-bold text-xs">${data.departure_time || '-'}</td>
                        <td class="p-3 text-right">
                            <span class="font-bold text-slate-800 text-sm block">${sym} ${displayAmount}</span>
                            ${unitTableDisplay}
                            <span class="text-xs text-red-500 font-bold block">成本: ${sym} ${displayCost}</span>
                            <p class="text-[10px] text-slate-500 font-normal mt-1 border-t border-slate-200 pt-1">NT$ ${data.twd.toLocaleString()}</p>
                        </td>
                        <td class="p-3 text-center no-print">
                            <button onclick="editOrder('${doc.id}')" class="text-blue-600 hover:bg-blue-50 px-2 py-1 rounded text-xs mr-1 transition font-bold">修改</button>
                            <button onclick="deleteOrder('${doc.id}')" class="text-red-500 hover:bg-red-50 px-2 py-1 rounded text-xs transition font-bold">刪除</button>
                        </td>
                    </tr>
                `;
            });
        }

        if (document.getElementById('rep-total-count')) {
            document.getElementById('rep-total-count').innerText = reportCount;
            document.getElementById('rep-unpaid-sum').innerText = "NT$ " + totalUnpaid.toLocaleString();
            document.getElementById('rep-paid-sum').innerText = "NT$ " + totalPaid.toLocaleString();
        }
    };

    import("https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js").then(async (firebaseApp) => {
        firestoreRef = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
        const app = firebaseApp.initializeApp(firebaseConfig);
        db = firestoreRef.getFirestore(app);

        document.getElementById('statusText').innerText = "資料庫連線成功 🟢";
        document.getElementById('statusText').classList.replace("text-slate-500", "text-emerald-600");

        document.getElementById('confirmSaveBtn').addEventListener('click', () => {
            const btn = document.getElementById('confirmSaveBtn');
            btn.disabled = true; btn.innerText = "寫入中...";
            try {
                if (window.currentEditId) {
                    firestoreRef.updateDoc(firestoreRef.doc(db, "orders", window.currentEditId), pendingData).catch(e => console.error(e));
                } else {
                    firestoreRef.addDoc(firestoreRef.collection(db, "orders"), pendingData).catch(e => console.error(e));
                }
            } finally {
                modal.classList.add('hidden'); 
                btn.innerText = "確認並存入"; btn.disabled = false;
                window.resetFormUI();
            }
        });

        window.deleteOrder = (id) => {
            if (confirm('確定要刪除這筆訂單嗎？')) firestoreRef.deleteDoc(firestoreRef.doc(db, "orders", id));
        };

        window.togglePayment = (id, currentStatus) => {
            const newStatus = currentStatus === 'paid' ? 'unpaid' : 'paid';
            firestoreRef.updateDoc(firestoreRef.doc(db, "orders", id), { payment_status: newStatus });
        };
        
        window.toggleCase = (id, currentStatus) => {
            const newStatus = currentStatus === 'closed' ? 'open' : 'closed';
            firestoreRef.updateDoc(firestoreRef.doc(db, "orders", id), { case_status: newStatus });
        };

        window.editOrder = (id) => {
            const doc = window.allOrders.find(o => o.id === id);
            if(!doc) return;
            window.currentEditId = id;
            const data = doc.data;
            
            document.getElementById('mode').value = data.mode;
            document.getElementById('customer').value = data.customer || '';
            
            const savedCurrency = data.currency || 'AUD';
            document.getElementById('currency').value = savedCurrency;
            window.handleCurrencyChange(); 
            document.getElementById('fxRate').value = data.fx_rate || 23; 
            document.getElementById('fxRate').disabled = (savedCurrency === 'TWD');
            
            document.getElementById('unitPrice').value = data.unit_price || ''; 
            document.getElementById('pax').value = data.pax || 1;
            document.getElementById('amount').value = data.amount || data.aud || '';
            
            document.getElementById('cost').value = data.cost || '0';
            document.getElementById('paymentStatus').value = data.payment_status || (data.status === 'completed' ? 'paid' : 'unpaid');
            document.getElementById('caseStatus').value = data.case_status || (data.status === 'completed' ? 'closed' : 'open');
            
            document.getElementById('departureTime').value = data.departure_time || '';
            document.getElementById('note').value = data.note || '';
            document.getElementById('specialInfo').value = data.special_info || '';

            if(window.currentTab === 'report') window.switchTab('dashboard');

            document.getElementById('formTitle').innerText = "✏️ 修改訂單模式";
            document.getElementById('formTitle').classList.replace("text-slate-800", "text-orange-600");
            document.getElementById('formSection').classList.add("bg-orange-50", "border-orange-300");
            document.getElementById('formSubmitBtn').innerText = "預覽並準備更新";
            document.getElementById('formSubmitBtn').classList.replace("bg-emerald-600", "bg-orange-600");
            document.getElementById('cancelEditBtn').classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        const q = firestoreRef.query(firestoreRef.collection(db, "orders")); 
        firestoreRef.onSnapshot(q, (snapshot) => {
            window.allOrders = [];
            snapshot.forEach(doc => window.allOrders.push({ id: doc.id, data: doc.data() }));
            window.renderUI(); 
        });

    }).catch(err => {
        document.getElementById('statusText').innerText = "尚未設定 Firebase 金鑰或連線失敗 🔴";
        document.getElementById('statusText').classList.replace("text-slate-500", "text-red-500");
    });
</script>
</body>
</html>
